name: Android CI

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  push:
    branches: [ "master", "stable" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "stable" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assemble

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-apk
        path: app/build/outputs/apk/*/release/BoomingMusic-*.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: release-apk
      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          files: normal/release/BoomingMusic-*.apk
          prerelease: true
